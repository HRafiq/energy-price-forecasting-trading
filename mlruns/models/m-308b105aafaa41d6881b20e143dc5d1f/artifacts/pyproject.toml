[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "energy-price-forecasting-trading"
version = "0.1.0"
description = "Probabilistic DE-LU day-ahead price forecasting and battery arbitrage trading"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
    "numpy==2.2.6",
    "pandas==2.3.1",
    # pandas has no parquet engine of its own; the processed dataset is parquet.
    "pyarrow==19.0.1",
    "requests==2.32.4",
    "lightgbm==4.7.0",
    "quantile-forest==1.4.2",
    "scikit-learn==1.9.1",
    "statsforecast==2.1.1",
    "mlflow==3.16.0",
    "holidays==0.104",
    "openpyxl==3.1.5",
    "yfinance==1.7.0",
    "xlrd==2.0.2",
    "pulp>=3.3,<4",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "openai>=3.14.1,<4",
    "anthropic>=1.6.0,<2",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
eda = [
    "ipykernel==7.3.0",
    "matplotlib==3.10.3",
    "nbconvert==7.17.1",
]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.5",
    "mypy==1.17.0",
    "pandas-stubs==2.3.0.250703",
    "types-pyyaml==6.0.12.20250516",
    "types-requests==2.32.4.20250611",
    "httpx==0.28.1",
]

[project.scripts]
ept-build-dataset = "src.ingest.build_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
# PuLP 3.3 flags its bundled CBC runner for removal in PuLP 4; pulp is pinned below 4.
filterwarnings = ["ignore:PULP_CBC_CMD is deprecated:DeprecationWarning"]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"
# Generated by the notebook builders in notebooks/, which are linted instead.
extend-exclude = ["notebooks/model_comparison.ipynb", "notebooks/backtest_report.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Cell source kept as strings; line length is notebook content, not code.
"notebooks/build_model_comparison.py" = ["E501"]
"notebooks/build_backtest_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests", "api", "dags"]

# Airflow and pendulum live in .venv-airflow, not in the project environment, so
# the DAG's imports have no stubs here. Everything else in dags/ is still checked.
[[tool.mypy.overrides]]
module = ["airflow.*", "pendulum.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "quantile_forest.*", "statsforecast.*", "yfinance.*", "pulp.*", "scipy.*"]
ignore_missing_imports = true
