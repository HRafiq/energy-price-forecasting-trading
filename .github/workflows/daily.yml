# The daily desk, run by GitHub rather than by a laptop being switched on.
#
# The local Airflow DAG and this workflow both shell into src/, so neither is
# the authority on what a run does. They are not identical: the DAG also exports
# the dashboard, which this workflow does not, because the dashboard is built
# and served from a machine that has the backtest artifacts. The runner bids,
# settles, records and monitors; the dashboard is refreshed when the state is
# pulled down and exported locally.
#
# What else differs is what surrounds them: a runner is a fresh machine, so the
# state the desk must remember is checked out from the live-state branch before
# the run and committed back to it after, and a failure opens an issue instead
# of waiting to be noticed.
#
# Timing. The gate closes at 12:00 Berlin, which is 10:00 UTC in summer and
# 11:00 UTC in winter, so summer is the case to size for. GitHub does not fire
# these when asked. Delays on this repository ran from 4h 14m to 5h 23m through
# September, and three bids were then missed, for 29 and 30 September and
# 1 October, when the delay drifted to between 6h 22m and 7h 39m. One cron with
# one margin cannot be sized against a distribution that moves, so this no
# longer tries. Eight crons span midnight to 09:00 UTC, close enough together
# that any delay from none at all up to about nine hours puts some run inside
# the window where the feeds exist and the gate is still open. Each sits on an
# odd minute: the top and the half of the hour are the most contended slots on
# GitHub's scheduler.
#
# They stop at 09:00 and do not reach back into the evening, which would buy
# more margin against a long delay, because the delivery day is whatever is
# tomorrow when the job actually runs. An evening cron that fired on time would
# bid for a day whose gate shut that morning and book itself a late bid for
# nothing.
#
# A run that lands with hours still to go does not sit and burn the six-hour
# ceiling a hosted job has. It stands down without bidding and leaves the next
# cron to carry on, so the chain behaves as one long poll made of short jobs.
#
# There are eight of them because a scheduled run is not a promise. GitHub
# delays them under load and drops them outright, and the first windows after a
# schedule is registered are the least reliable of all: this workflow's first
# two scheduled runs never started. Nothing reports that, either, because the
# failure issue and the incident log both need a run to be running before they
# can say anything. A schedule that does not fire is silent by construction.
#
# So the answer is repetition rather than alarm. An attempt that lands with more
# than four hours to the gate stands down before the bid step and costs a few
# minutes of ingest; one that lands inside the window polls and bids, and any
# that follow it find a day with a committed schedule and are refused at the
# guard. Eight chances to start turns a dropped run from a missed gate into a
# late start.
#
# What repetition still cannot do is report a day on which every attempt was
# dropped. The runs that stood down exit green and say nothing, and the gap is
# only written the following day, by the step that sweeps for days with no bid.
# Closing that properly needs a heartbeat watched from outside this workflow,
# which does not exist yet.
#
# No secrets. The daily path reads SMARD, Open-Meteo and the fuel prices, none
# of which need a key. ENTSOE_API_KEY belongs to a separate cross-check that
# this workflow does not run.
#
# History. A laptop pays for the years of market data once and keeps the cache;
# a runner holds none, so it would pay again on every run for a bid that reaches
# back a fortnight. src.pipeline.history sizes the window from what the day
# actually needs: the drift monitor's rolling window on an ordinary day, and the
# model's whole training window on the one day in 28 that a refit falls due.

name: daily desk

on:
  schedule:
    # UTC, deliberately off the hour and the half hour.
    - cron: "13 0 * * *"
    - cron: "29 1 * * *"
    - cron: "41 2 * * *"
    - cron: "59 3 * * *"
    - cron: "17 5 * * *"
    - cron: "43 6 * * *"
    - cron: "53 7 * * *"
    - cron: "47 8 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Delivery day to bid for (default: tomorrow)"
        required: false
        type: string

concurrency:
  # Never two runs at once: they would race for the same committed schedule.
  group: daily-desk
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  bid:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out the pipeline
        uses: actions/checkout@v4

      - name: Check out the desk's state
        uses: actions/checkout@v4
        with:
          ref: live-state
          path: .live-state

      # setup-uv has no python-version-file input; passing one is accepted
      # silently and does nothing, so the version is read here and handed over
      # explicitly. .python-version stays the single source of truth, which uv
      # also reads on a laptop.
      - name: Read the pinned interpreter
        id: python
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The registered model is a pickle of objects backed by native
          # extensions. Unpickling one under a different Python minor version
          # segmentation faults rather than raising, so the interpreter is
          # pinned to the one the model was registered under.
          python-version: ${{ steps.python.outputs.version }}

      - name: Install the project
        run: uv sync --frozen

      - name: Restore the desk's state
        run: uv run python -m src.pipeline.state restore --store .live-state

      - name: Work out the delivery day
        id: day
        run: |
          day="${{ inputs.day }}"
          if [ -z "$day" ]; then day=$(date -u -d "tomorrow" +%Y-%m-%d); fi
          echo "delivery=$day" >> "$GITHUB_OUTPUT"
          echo "settle=$(date -u -d "$day -1 day" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Bidding for $day"

      - name: Work out how much history this run needs
        id: history
        run: |
          days=$(uv run python -m src.pipeline.history \
            --day ${{ steps.day.outputs.delivery }} | head -1)
          echo "days=$days" >> "$GITHUB_OUTPUT"
          echo "fetching $days days of history"

      - name: Rebuild the market data
        run: |
          uv run python -m src.ingest.build_dataset \
            --through ${{ steps.day.outputs.delivery }} \
            --history-days ${{ steps.history.outputs.days }}
          uv run python -m src.ingest.open_meteo \
            --history-days ${{ steps.history.outputs.days }}
          uv run python -m src.ingest.fuels
          uv run python -m src.ingest.build_inputs

      - name: Wait for the feeds, until the cutoff or the stand-down
        id: wait
        # The Airflow DAG polls a sensor until every feed has arrived or the
        # deadline passes; without the same thing here a run that starts before
        # the load forecast is published bids on a fallback rung for no reason.
        # Each poke re-fetches every feed the step above fetched and then
        # rebuilds, because a feed that has published since the last poke is
        # invisible until it has been fetched again as well as rebuilt. Polling
        # only the rebuild is what cost the production forecast on 3, 4 and 5
        # October: the runs landed hours earlier than they used to, caught the
        # weather four quarter-hours short, and then rebuilt the same shortfall
        # every five minutes until the cutoff. The cutoff is
        # 45 minutes before the summer gate at 10:00 UTC, which is the earlier
        # of the two gates, so it holds all year. A run that starts after the
        # cutoff, which is what a delayed schedule looks like, falls straight
        # through and bids with whatever the chain can use.
        run: |
          # Everything here is measured against this delivery day's own gate,
          # not against the clock, so it survives the delivery day rolling over
          # while a delayed run waits. The gate is 12:00 in Berlin, which is
          # 10:00 UTC in summer and 11:00 UTC in winter, and it is resolved in
          # that timezone rather than pinned to the summer value. Pinning it
          # would make the cutoff fire an hour early all winter, giving up on a
          # load forecast that still had an hour to arrive. This is the same
          # instant the Airflow DAG and src/pipeline/daily_run.py derive from
          # the market's configured gate, so the two arms of the desk agree.
          # Two steps, using the same date form the delivery step already uses,
          # rather than one expression whose parse is easy to get wrong: in
          # "2026-10-02 10:00 -1 day" the -1 is eaten as a timezone offset.
          gate_day=$(date -u -d "${{ steps.day.outputs.delivery }} -1 day" +%Y-%m-%d)
          gate=$(TZ=Europe/Berlin date -d "$gate_day 12:00" +%s)
          # The load forecast lands somewhere between 08:00 and 09:00 UTC, so a
          # run with more than four hours still to go has nothing to poll for.
          too_early=$(( 4 * 60 ))
          cutoff=$(( 45 ))
          # The poll needs no cap of its own. It can only start once there are
          # four hours or less to the gate and it always ends by the cutoff, so
          # it runs for at most 195 minutes, a long way inside the six hours at
          # which a hosted job is killed whatever timeout-minutes says. Only a
          # run leaving this loop with proceed=true goes on to bid.
          while true; do
            left=$(( (gate - $(date -u +%s)) / 60 ))
            if (( left <= cutoff )); then
              echo "$left min to the gate: bidding on whatever the chain can use"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            # Exit 1 is "not ready yet". Anything else is the check itself
            # broken, which must be loud rather than spend three hours looking
            # like a feed that never came.
            set +e
            uv run python -m src.pipeline.readiness \
              --day ${{ steps.day.outputs.delivery }}
            ready=$?
            set -e
            if (( ready == 0 )); then
              echo "every feed has arrived, $left min before the gate"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if (( ready != 1 )); then
              echo "readiness exited $ready, which is not 'feeds missing'"
              exit "$ready"
            fi
            if (( left > too_early )); then
              echo "$left min to the gate and the feeds are not in: standing"
              echo "down for the next cron rather than bidding a fallback early"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "waiting five minutes, then rebuilding"
            sleep 300
            # A slow poke must not carry the run past the gate. SMARD can take
            # tens of minutes when it is unwell, and the loop only measured the
            # clock at the top, so one bad rebuild could leave the cutoff behind
            # and still bid. Cap them, and look at the clock again straight
            # after rather than at the top of the next lap.
            timeout 600 uv run python -m src.ingest.build_dataset \
              --through ${{ steps.day.outputs.delivery }} \
              --history-days ${{ steps.history.outputs.days }} || true
            timeout 300 uv run python -m src.ingest.open_meteo \
              --history-days ${{ steps.history.outputs.days }} || true
            timeout 120 uv run python -m src.ingest.fuels || true
            timeout 300 uv run python -m src.ingest.build_inputs || true
            if (( (gate - $(date -u +%s)) / 60 <= cutoff )); then
              echo "the rebuild ran into the cutoff: bidding on what there is"
              echo "proceed=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Bid
        if: steps.wait.outputs.proceed == 'true'
        run: uv run python -m src.pipeline.daily_run --day ${{ steps.day.outputs.delivery }}
        # A plan committed by a run that then died leaves no run record, and the
        # pipeline refuses to guess whether to keep or replace it. That is right,
        # but it must be said once and looked at, not failed every run forever.

      - name: Check the deadline
        # Only on a run that bid. A run that stood down early is not evidence
        # that a day was missed, and recording it as one would cry wolf on
        # every poll of the chain.
        if: always() && steps.wait.outputs.proceed == 'true'
        run: uv run python -m src.pipeline.daily_run --day ${{ steps.day.outputs.delivery }} --check-deadline

      - name: Settle yesterday
        if: always()
        run: uv run python -m src.pipeline.daily_run --day ${{ steps.day.outputs.settle }} --settle

      - name: Record the days with no bid
        if: always()
        run: uv run python -m src.pipeline.gaps --through ${{ steps.day.outputs.settle }}

      - name: Run the drift monitor
        if: always()
        run: uv run python -m src.pipeline.drift_check --through ${{ steps.day.outputs.settle }}

      - name: Save the desk's state
        if: always()
        run: uv run python -m src.pipeline.state save --store .live-state

      - name: Commit the state
        if: always()
        working-directory: .live-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f because the pipeline's own .gitignore covers data/ and the
          # registry; on this branch those files are the entire point.
          git add -Af .
          if git diff --cached --quiet; then
            echo "the run changed nothing"
            exit 0
          fi
          git commit -m "Desk state after the run for ${{ steps.day.outputs.delivery }}"
          # Another run may have pushed while this one worked; rebase onto it
          # rather than overwriting a record that is already on the branch.
          for attempt in 1 2 3; do
            if git push origin live-state; then exit 0; fi
            echo "push attempt $attempt was rejected, rebasing onto the branch"
            # A rebase that stops on a conflicting binary leaves a rebase in
            # progress, and retrying the same command then fails on that rather
            # than on the push. Abandon it and take the branch's file, because a
            # later run's state already contains this run's.
            git pull --rebase -X theirs origin live-state || git rebase --abort
            sleep 5
          done
          exit 1

      - name: Open an issue if the desk failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const day = "${{ steps.day.outputs.delivery }}";
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Daily desk failed for delivery day ${day}`;
            const open = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", labels: "daily-desk",
            });
            const already = open.data.find((issue) => issue.title === title);
            const body = [
              `The scheduled run for delivery day ${day} did not finish.`,
              ``,
              `Run: ${url}`,
              ``,
              `If the gate at 12:00 Berlin has not passed, a rerun still bids.`,
              `A day that already has a committed schedule is refused, so a rerun`,
              `cannot bid twice.`,
              ``,
              `One case needs a person: if a run committed a schedule and died`,
              `before writing its run record, every later run for that day fails`,
              `until someone looks and reruns it with --replace.`,
            ].join("\n");
            if (already) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: already.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ["daily-desk"],
              });
            }
