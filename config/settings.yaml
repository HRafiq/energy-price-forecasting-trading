# Project settings. Validated at load time by src/config.py; a typo fails fast.
# SMARD publishes volumes as MWh per interval; the dataset stores them as
# average MW, so any resolution compares directly.

market:
  bidding_zone: DE-LU
  timezone: Europe/Berlin
  gate_closure_local: "12:00"
  # The daily forecast for local day D+1 is issued at this time on day D.
  forecast_issue_local: "11:40"
  # The DE-LU zone exists from this day. Before it, Germany shared a price
  # with Austria (DE-AT-LU), so earlier prices are a different market.
  zone_start: "2018-10-01"
  # Day-ahead moved to 15-minute products for delivery from this day.
  quarter_hour_products_from: "2025-10-01"

data:
  source: smard
  # Quarter-hourly, the granularity the day-ahead market trades today. Before
  # market.quarter_hour_products_from the market traded hourly products, so
  # those quarter-hours repeat their hour's price and price_product_minutes is
  # 60. See docs/decisions.md.
  modeling_resolution: quarterhour
  # A local calendar day in market.timezone.
  start: "2018-10-01"
  raw_dir: data/raw
  processed_dir: data/processed
  dataset_file: smard_quarterhour.parquet
  # SMARD dataset joined with weather forecasts and fuel prices; models read this.
  inputs_file: model_inputs_quarterhour.parquet

smard:
  base_url: https://www.smard.de/app/chart_data
  region: DE
  resolution: quarterhour
  timeout_s: 30
  max_workers: 4
  # A weekly chunk counts as settled once this many newer chunks exist. Only a
  # chunk that had settled when it was downloaded is served from cache; the
  # current week is incomplete and recent values can still be revised (D2).
  refresh_recent_chunks: 4
  # Column name -> SMARD filter id. Volume columns are converted to average MW.
  series:
    price_eur_mwh: 4169               # day-ahead price, DE-LU
    load_actual_mw: 410              # grid load, actual
    load_forecast_mw: 411            # grid load, day-ahead forecast
    wind_onshore_actual_mw: 4067
    wind_offshore_actual_mw: 1225
    solar_actual_mw: 4068
    wind_onshore_forecast_mw: 123    # day-ahead forecast
    wind_offshore_forecast_mw: 3791  # day-ahead forecast
    solar_forecast_mw: 125           # day-ahead forecast

weather:
  # Open-Meteo Previous Runs API: archived weather-model forecasts at fixed lead
  # times. Data licence CC BY 4.0; free API for non-commercial use.
  base_url: https://previous-runs-api.open-meteo.com/v1/forecast
  # Use the forecast issued this many days before each valid time. Two days is
  # the shortest lead that is published before 11:40 on day D for every period
  # of day D+1.
  lead_days: 2
  # First day with complete archived forecasts for every variable.
  start: "2024-03-01"
  timeout_s: 60
  request_days: 31
  variables: [wind_speed_100m, shortwave_radiation, temperature_2m]
  # Name -> [latitude, longitude]: wind regions, offshore clusters, solar south.
  points:
    north_sea_offshore: [54.4, 6.8]
    baltic_offshore: [54.7, 13.8]
    schleswig_holstein: [54.3, 9.5]
    lower_saxony_coast: [53.3, 7.8]
    lower_saxony_inland: [52.8, 9.5]
    mecklenburg: [53.8, 12.5]
    brandenburg: [52.3, 13.5]
    saxony_anhalt: [51.9, 11.7]
    north_rhine_westphalia: [51.6, 7.5]
    hesse_thuringia: [50.9, 10.0]
    baden_wuerttemberg: [48.6, 9.0]
    bavaria: [48.8, 11.8]

fuels:
  # Daily settlement of front-month Dutch TTF gas futures, via Yahoo Finance.
  ttf_ticker: TTF=F
  # EEX EU ETS primary auction results: price in EUR per tonne CO2.
  eua_archive_url: https://www.eex.com/fileadmin/EEX/Downloads/Markets/Environmentals/EUA_Emission_Spot_Primary_Market_Auction_Report/Archive_Reports/emission-spot-primary-market-auction-report-2012-2025-data.zip
  eua_archive_last_year: 2025
  eua_year_url: https://public.eex-group.com/eex/eua-auction-report/emission-spot-primary-market-auction-report-{year}-data.xlsx
  timeout_s: 120

availability:
  # When each column is known at the issue time. Models only ever see this view
  # (src/forecasting/information.py). See docs/data_guide.md §9.
  #   before_target_day   periods before local day D+1 starts
  #   through_target_day  also every period of day D+1
  #   before_issue_lag    periods ending at least actuals_lag_minutes before
  #                       the issue time on day D
  # SMARD's measured values ended about two to three hours before download in
  # one observed build. Conservative until measured properly.
  actuals_lag_minutes: 180
  columns:
    price_eur_mwh: before_target_day            # day D prices published on D-1
    load_actual_mw: before_issue_lag
    load_forecast_mw: through_target_day        # due two hours before the gate
    wind_onshore_actual_mw: before_issue_lag
    wind_offshore_actual_mw: before_issue_lag
    solar_actual_mw: before_issue_lag
    wind_onshore_forecast_mw: before_target_day  # D+1 forecast arrives 18:00 on D
    wind_offshore_forecast_mw: before_target_day
    solar_forecast_mw: before_target_day
    residual_load_actual_mw: before_issue_lag
    residual_load_forecast_mw: before_target_day
    price_product_minutes: through_target_day   # fixed by the calendar
    # Fuel rows for local day x carry the last price published before day x.
    gas_ttf_eur_mwh: before_target_day
    carbon_eua_eur_t: before_target_day
    # Weather forecasts issued two days before each valid time, so every period
    # of day D+1 was forecast by 23:45 on day D-1.
    wx_north_sea_offshore_wind_speed_100m: through_target_day
    wx_north_sea_offshore_shortwave_radiation: through_target_day
    wx_north_sea_offshore_temperature_2m: through_target_day
    wx_baltic_offshore_wind_speed_100m: through_target_day
    wx_baltic_offshore_shortwave_radiation: through_target_day
    wx_baltic_offshore_temperature_2m: through_target_day
    wx_schleswig_holstein_wind_speed_100m: through_target_day
    wx_schleswig_holstein_shortwave_radiation: through_target_day
    wx_schleswig_holstein_temperature_2m: through_target_day
    wx_lower_saxony_coast_wind_speed_100m: through_target_day
    wx_lower_saxony_coast_shortwave_radiation: through_target_day
    wx_lower_saxony_coast_temperature_2m: through_target_day
    wx_lower_saxony_inland_wind_speed_100m: through_target_day
    wx_lower_saxony_inland_shortwave_radiation: through_target_day
    wx_lower_saxony_inland_temperature_2m: through_target_day
    wx_mecklenburg_wind_speed_100m: through_target_day
    wx_mecklenburg_shortwave_radiation: through_target_day
    wx_mecklenburg_temperature_2m: through_target_day
    wx_brandenburg_wind_speed_100m: through_target_day
    wx_brandenburg_shortwave_radiation: through_target_day
    wx_brandenburg_temperature_2m: through_target_day
    wx_saxony_anhalt_wind_speed_100m: through_target_day
    wx_saxony_anhalt_shortwave_radiation: through_target_day
    wx_saxony_anhalt_temperature_2m: through_target_day
    wx_north_rhine_westphalia_wind_speed_100m: through_target_day
    wx_north_rhine_westphalia_shortwave_radiation: through_target_day
    wx_north_rhine_westphalia_temperature_2m: through_target_day
    wx_hesse_thuringia_wind_speed_100m: through_target_day
    wx_hesse_thuringia_shortwave_radiation: through_target_day
    wx_hesse_thuringia_temperature_2m: through_target_day
    wx_baden_wuerttemberg_wind_speed_100m: through_target_day
    wx_baden_wuerttemberg_shortwave_radiation: through_target_day
    wx_baden_wuerttemberg_temperature_2m: through_target_day
    wx_bavaria_wind_speed_100m: through_target_day
    wx_bavaria_shortwave_radiation: through_target_day
    wx_bavaria_temperature_2m: through_target_day

evaluation:
  # Final untouched test period (T6). No tuning, no EDA, no model selection
  # reads data from this local day onward until final reporting in Phase 4.
  # Confirmed 2026-09-13: training keeps eight months of genuine 15-minute
  # prices, including April and May. See docs/decisions.md.
  holdout_start: "2026-06-01"
  # First day forecast in walk-forward runs; leaves the history baselines need.
  first_target_day: "2019-01-01"
  # Model comparison window for Phase 2: two years ending at the hold-out,
  # covering post-crisis hourly products and all 15-minute training months.
  validation_start: "2024-06-01"
  # A day with any price above this counts as a spike day in evaluation.
  spike_threshold_eur_mwh: 200

forecasting:
  quantiles: [0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95]
  # Chosen in Phase 2 from six candidates; see notebooks/model_comparison.ipynb
  # and docs/decisions.md.
  production_model: lightgbm_conformal

baselines:
  # Past days whose errors set each baseline's quantiles, per local hour.
  error_window_days: 28
  # Refuse to forecast when fewer past days than this produced errors: the
  # ranges would look precise while resting on too little history.
  min_error_days: 14

battery:
  power_mw: 1.0
  capacity_mwh: 2.0
  round_trip_efficiency: 0.90
  degradation_eur_per_mwh: 8.0

health:
  # Rolling 90% interval coverage below this raises a drift alert (M2).
  coverage_alert_threshold: 0.82
