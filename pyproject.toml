[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "energy-price-forecasting-trading"
version = "0.1.0"
description = "Probabilistic DE-LU day-ahead price forecasting and battery arbitrage trading"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic==2.11.7",
    "pyyaml==6.0.2",
    "numpy==2.2.6",
    "pandas==2.3.1",
    # pandas has no parquet engine of its own; the processed dataset is parquet.
    "pyarrow==19.0.1",
    "requests==2.32.4",
]

[project.optional-dependencies]
eda = [
    "matplotlib==3.10.3",
]
dev = [
    "pytest==8.4.1",
    "pytest-cov==6.2.1",
    "ruff==0.12.5",
    "mypy==1.17.0",
    "pandas-stubs==2.3.0.250703",
    "types-pyyaml==6.0.12.20250516",
    "types-requests==2.32.4.20250611",
]

[project.scripts]
ept-build-dataset = "src.ingest.build_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
files = ["src", "tests"]
